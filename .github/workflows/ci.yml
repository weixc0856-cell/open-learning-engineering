name: CI Verification & Documentation Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.11

      - name: Install Lint & Docs Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml mkdocs-material

      - name: Run Repository Structure & Lab Unit Tests
        run: |
          python3 scripts/verify_repo.py
          python3 scripts/check_sources.py
          python3 -m unittest discover -s tests -p "test_*.py"

      - name: Verify MkDocs Build
        run: |
          mkdocs build --strict
